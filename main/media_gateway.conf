# =========================
# RKMediaGateway 多路流配置
# =========================

# 网关公共配置
# GATEWAY_LOW_LATENCY_MODE: 是否启用低延迟模式，1 表示减少编码和输出缓存。
GATEWAY_LOW_LATENCY_MODE=1
# GATEWAY_STATS_INTERVAL_SEC: 运行统计日志打印周期，单位秒。
GATEWAY_STATS_INTERVAL_SEC=5
# GATEWAY_CAPTURE_RETRY_MS: 视频采集失败后的重试间隔，单位毫秒。
GATEWAY_CAPTURE_RETRY_MS=5
# GATEWAY_MAX_CONSECUTIVE_FAILURES: 视频采集连续失败达到该次数后认为采集源异常。
GATEWAY_MAX_CONSECUTIVE_FAILURES=30
# GATEWAY_RECORD_FILE_PATH: 本地录像文件路径，留空表示不录像。
GATEWAY_RECORD_FILE_PATH=
# GATEWAY_RECORD_FLUSH_INTERVAL_FRAMES: 本地录像每写入多少帧执行一次 flush。
GATEWAY_RECORD_FLUSH_INTERVAL_FRAMES=30
# GATEWAY_CONFIG_FILE_PATH: 配置文件路径，用于加载配置和日志展示。
GATEWAY_CONFIG_FILE_PATH=media_gateway.conf
# LOG_LEVEL: 0=debug, 1=info, 2=warn, 3=error
LOG_LEVEL=2

# -------------------------
# Dynamic frame-rate policy
# -------------------------
# AE-driven policy: bright=60fps, normal=30fps, low-light=15fps.
# DYNAMIC_FPS_ENABLE: 是否启用亮度/AE 感知帧率策略。
DYNAMIC_FPS_ENABLE=1
# DYNAMIC_FPS_NORMAL_FPS: 正常光照场景目标帧率。
DYNAMIC_FPS_NORMAL_FPS=30
# DYNAMIC_FPS_LOW_LIGHT_FPS: 低照场景目标帧率。
DYNAMIC_FPS_LOW_LIGHT_FPS=15
# DYNAMIC_FPS_BRIGHT_FPS: 亮光场景目标帧率。
DYNAMIC_FPS_BRIGHT_FPS=60
# DYNAMIC_FPS_MIN_SWITCH_INTERVAL_MS: 两次帧率切换的最小间隔，单位毫秒。
DYNAMIC_FPS_MIN_SWITCH_INTERVAL_MS=30000
# DYNAMIC_FPS_EVALUATE_INTERVAL_MS: 亮度/AE 策略评估周期，单位毫秒。
DYNAMIC_FPS_EVALUATE_INTERVAL_MS=1000
# DYNAMIC_FPS_BRIGHT_CONFIRM_MS: 亮光候选场景确认时间，单位毫秒。
DYNAMIC_FPS_BRIGHT_CONFIRM_MS=1000
# DYNAMIC_FPS_LOW_LIGHT_CONFIRM_MS: 低照候选场景确认时间，单位毫秒。
DYNAMIC_FPS_LOW_LIGHT_CONFIRM_MS=15000
# DYNAMIC_FPS_BRIGHT_MAX_EXPOSURE_US: 亮光判定允许的最大曝光时间，单位微秒。
DYNAMIC_FPS_BRIGHT_MAX_EXPOSURE_US=8000
# DYNAMIC_FPS_BRIGHT_MAX_ANALOG_GAIN: 亮光判定允许的最大模拟增益。
DYNAMIC_FPS_BRIGHT_MAX_ANALOG_GAIN=2.0
# DYNAMIC_FPS_BRIGHT_MIN_MEAN_LUMA: 亮光判定要求的最小平均亮度。
DYNAMIC_FPS_BRIGHT_MIN_MEAN_LUMA=58
# DYNAMIC_FPS_LOW_LIGHT_MIN_EXPOSURE_RATIO: 低照判定要求的曝光/帧周期最小比例。
DYNAMIC_FPS_LOW_LIGHT_MIN_EXPOSURE_RATIO=0.85
# DYNAMIC_FPS_LOW_LIGHT_MIN_ANALOG_GAIN: 低照判定要求的最小模拟增益。
DYNAMIC_FPS_LOW_LIGHT_MIN_ANALOG_GAIN=4.0
# DYNAMIC_FPS_LOW_LIGHT_MAX_MEAN_LUMA: 低照判定允许的最大平均亮度。
DYNAMIC_FPS_LOW_LIGHT_MAX_MEAN_LUMA=42
# DYNAMIC_FPS_AE_SCENE_CONFIRM_MS: AE 三态默认确认时间，单位毫秒。
DYNAMIC_FPS_AE_SCENE_CONFIRM_MS=3000

# -------------------------
# ISP / RKAIQ lifecycle
# -------------------------
# ISP_ENABLE:
#   0 disables RKAIQ and keeps the existing plain V4L2 capture path.
#   1 starts RKAIQ before V4L2 STREAMON, then stops it after V4L2 deinit.
# ISP_SENSOR_NAME can be empty; RKAIQ will try to resolve it from ISP_VIDEO_DEVICE.
# ISP_WORKING_MODE: 0=normal, 16=HDR2, 32=HDR3 for common RKAIQ SDKs.
# ISP_FALLBACK_ON_ERROR=1 lets the gateway continue when RKAIQ init fails.
# ISP_ENABLE: 是否启动 RKAIQ/ISP 控制链路。
ISP_ENABLE=1
# ISP_SENSOR_NAME: ISP 传感器名称，留空时按视频设备推断。
ISP_SENSOR_NAME=
# ISP_VIDEO_DEVICE: ISP 关联的视频设备节点。
ISP_VIDEO_DEVICE=/dev/video0
# ISP_IQ_DIR: RKAIQ IQ 文件目录。
ISP_IQ_DIR=/etc/iqfiles
# ISP_FORCE_IQ_FILE: 强制指定 IQ 文件，留空表示自动匹配。
ISP_FORCE_IQ_FILE=
# ISP_WIDTH: ISP 输入宽度。
ISP_WIDTH=2112
# ISP_HEIGHT: ISP 输入高度。
ISP_HEIGHT=1568
# ISP_WORKING_MODE: ISP 工作模式，0=normal，16=HDR2，32=HDR3。
ISP_WORKING_MODE=0
# ISP_KEEP_EXTERNAL_HW_STATE: 是否保留外部已配置的硬件状态。
ISP_KEEP_EXTERNAL_HW_STATE=0
# ISP_FALLBACK_ON_ERROR: ISP 初始化失败时是否退回普通 V4L2 采集。
ISP_FALLBACK_ON_ERROR=1

# -------------------------
# ISP health diagnostics
# -------------------------
# ISP_HEALTH_CHECK_ENABLE enables health state evaluation in [ISP_STAT].
# ISP_META_TIMEOUT_MS marks metas callback stalled after this interval.
# ISP_MAX_ERROR_COUNT marks ISP unhealthy after this many RKAIQ error callbacks.
# ISP_RESTART_ON_FAULT is reserved for a future coordinated V4L2/RKAIQ restart path.
# ISP_HEALTH_CHECK_ENABLE: 是否启用 ISP 健康检查。
ISP_HEALTH_CHECK_ENABLE=1
# ISP_META_TIMEOUT_MS: meta 回调超时时间，单位毫秒。
ISP_META_TIMEOUT_MS=2000
# ISP_MAX_ERROR_COUNT: ISP 错误回调累计阈值。
ISP_MAX_ERROR_COUNT=3
# ISP_RESTART_ON_FAULT: ISP 异常后是否自动重启，当前预留。
ISP_RESTART_ON_FAULT=0

# -------------------------
# ISP low-light scene optimization
# -------------------------
# Enables automatic night/low-light optimization based on RKAIQ AE env_lux/mean_luma.
# Enter/exit thresholds use hysteresis to avoid frequent toggling near the boundary.
# In low light, the gateway can raise exposure/gain, increase NR, lower sharpness,
# and boost encoder bitrate to absorb sensor noise complexity.
# ISP_LOW_LIGHT_ENABLE: ISP 低照优化参数：enable。
ISP_LOW_LIGHT_ENABLE=0
# ISP_LOW_LIGHT_ENTER_LUX: ISP 低照优化参数：enter lux。
ISP_LOW_LIGHT_ENTER_LUX=20
# ISP_LOW_LIGHT_EXIT_LUX: ISP 低照优化参数：exit lux。
ISP_LOW_LIGHT_EXIT_LUX=35
# ISP_LOW_LIGHT_ENTER_MEAN_LUMA: ISP 低照优化参数：enter mean luma。
ISP_LOW_LIGHT_ENTER_MEAN_LUMA=35
# ISP_LOW_LIGHT_EXIT_MEAN_LUMA: ISP 低照优化参数：exit mean luma。
ISP_LOW_LIGHT_EXIT_MEAN_LUMA=48
# ISP_LOW_LIGHT_EXPOSURE_GAIN: ISP 低照优化参数：exposure gain。
ISP_LOW_LIGHT_EXPOSURE_GAIN=-1
# ISP_LOW_LIGHT_EXPOSURE_TIME: ISP 低照优化参数：exposure time。
ISP_LOW_LIGHT_EXPOSURE_TIME=-1
# ISP_LOW_LIGHT_NR_STRENGTH: ISP 低照优化参数：nr strength。
ISP_LOW_LIGHT_NR_STRENGTH=70
# ISP_LOW_LIGHT_SHARPNESS: ISP 低照优化参数：sharpness。
ISP_LOW_LIGHT_SHARPNESS=35
# ISP_LOW_LIGHT_NORMAL_NR_STRENGTH: ISP 低照优化参数：normal nr strength。
ISP_LOW_LIGHT_NORMAL_NR_STRENGTH=-1
# ISP_LOW_LIGHT_NORMAL_SHARPNESS: ISP 低照优化参数：normal sharpness。
ISP_LOW_LIGHT_NORMAL_SHARPNESS=-1
# ISP_LOW_LIGHT_BITRATE_BOOST_PERCENT: ISP 低照优化参数：bitrate boost percent。
ISP_LOW_LIGHT_BITRATE_BOOST_PERCENT=25
# ISP_LOW_LIGHT_QP_DELTA: ISP 低照优化参数：qp delta。
ISP_LOW_LIGHT_QP_DELTA=-3
# ISP_LOW_LIGHT_MIN_SWITCH_INTERVAL_MS: ISP 低照优化参数：min switch interval ms。
ISP_LOW_LIGHT_MIN_SWITCH_INTERVAL_MS=5000

# -------------------------
# ISP runtime image controls
# -------------------------
# ISP_CONTROL_ENABLE:
#   0 keeps IQ/3A defaults unchanged.
#   1 applies the fields below after RKAIQ start.
# Integer controls use -1 to skip. Exposure/WB float values use <=0 to skip.
# OP mode values follow RKAIQ opMode_t: 0=auto, 1=manual, 2=semi-auto.
# ISP_POWER_LINE_FREQ: -1=skip, 0=disabled, 1=50Hz, 2=60Hz.
# ISP_CONTROL_ENABLE: ISP 图像控制参数：control enable。
ISP_CONTROL_ENABLE=0
# ISP_BRIGHTNESS: ISP 图像控制参数：brightness。
ISP_BRIGHTNESS=-1
# ISP_CONTRAST: ISP 图像控制参数：contrast。
ISP_CONTRAST=-1
# ISP_SATURATION: ISP 图像控制参数：saturation。
ISP_SATURATION=-1
# ISP_HUE: ISP 图像控制参数：hue。
ISP_HUE=-1
# ISP_SHARPNESS: ISP 图像控制参数：sharpness。
ISP_SHARPNESS=-1
# ISP_EXPOSURE_MODE: ISP 图像控制参数：exposure mode。
ISP_EXPOSURE_MODE=-1
# ISP_EXPOSURE_TIME: ISP 图像控制参数：exposure time。
ISP_EXPOSURE_TIME=-1
# ISP_EXPOSURE_GAIN: ISP 图像控制参数：exposure gain。
ISP_EXPOSURE_GAIN=-1
# ISP_WB_MODE: ISP 图像控制参数：wb mode。
ISP_WB_MODE=-1
# ISP_WB_CT: ISP 图像控制参数：wb ct。
ISP_WB_CT=0
# ISP_WB_RGAIN: ISP 图像控制参数：wb rgain。
ISP_WB_RGAIN=-1
# ISP_WB_GRGAIN: ISP 图像控制参数：wb grgain。
ISP_WB_GRGAIN=-1
# ISP_WB_GBGAIN: ISP 图像控制参数：wb gbgain。
ISP_WB_GBGAIN=-1
# ISP_WB_BGAIN: ISP 图像控制参数：wb bgain。
ISP_WB_BGAIN=-1
# ISP_ANTI_FLICKER_ENABLE: ISP 图像控制参数：anti flicker enable。
ISP_ANTI_FLICKER_ENABLE=-1
# ISP_POWER_LINE_FREQ: ISP 图像控制参数：power line freq。
ISP_POWER_LINE_FREQ=-1
# ISP_NR_MODE: ISP 图像控制参数：nr mode。
ISP_NR_MODE=-1
# ISP_ANR_STRENGTH: ISP 图像控制参数：anr strength。
ISP_ANR_STRENGTH=-1
# ISP_DEHAZE_MODE: ISP 图像控制参数：dehaze mode。
ISP_DEHAZE_MODE=-1
# ISP_DEHAZE_STRENGTH: ISP 图像控制参数：dehaze strength。
ISP_DEHAZE_STRENGTH=-1

# 性能测试埋点配置
# GATEWAY_BENCH_ENABLE:
#   0 关闭 [BENCH] 性能日志；1 开启采集、编码、推流入队分段耗时统计。
# GATEWAY_BENCH_SAMPLE_EVERY:
#   每隔多少个采集帧打印一条 [BENCH_FRAME] 逐帧日志。排查性能瓶颈时设为 1，即每帧打印。
# GATEWAY_BENCH_PRINT_INTERVAL_SEC:
#   [BENCH_SUMMARY] 汇总日志打印周期，单位秒；不影响逐帧 [BENCH_FRAME] 日志。
# GATEWAY_BENCH_ENABLE: 是否开启性能埋点日志。
GATEWAY_BENCH_ENABLE=1
# GATEWAY_BENCH_SAMPLE_EVERY: 逐帧性能日志采样间隔。
GATEWAY_BENCH_SAMPLE_EVERY=30
# GATEWAY_BENCH_PRINT_INTERVAL_SEC: 性能汇总日志打印周期，单位秒。
GATEWAY_BENCH_PRINT_INTERVAL_SEC=5

# -------------------------
# 采集源
# -------------------------
# 第一阶段采用 main_path/self_path 双采集源设计：
#   CAPTURE_MAIN_* 通常绑定 rkisp main_path，例如 /dev/video0，推荐 1920x1080。
#   CAPTURE_SUB_*  通常绑定 rkisp self_path，例如 /dev/video1，推荐 1280x720。
# STREAM_*_SOURCE_INDEX 用于把码流绑定到采集源：0=main_path，1=self_path。
# GATEWAY_CAPTURE_SOURCE_COUNT: 采集源数量。
GATEWAY_CAPTURE_SOURCE_COUNT=2

# CAPTURE_MAIN_ENABLE: 是否启用该对象。
CAPTURE_MAIN_ENABLE=1
# CAPTURE_MAIN_NAME: 名称，用于日志和通道标识。
CAPTURE_MAIN_NAME=main_path
# CAPTURE_MAIN_DEVICE: 设备节点。
CAPTURE_MAIN_DEVICE=/dev/video0
# CAPTURE_MAIN_WIDTH: 宽度。
CAPTURE_MAIN_WIDTH=1920
# CAPTURE_MAIN_HEIGHT: 高度。
CAPTURE_MAIN_HEIGHT=1080
# CAPTURE_MAIN_PIXELFORMAT: 像素格式，十进制 V4L2 fourcc。
CAPTURE_MAIN_PIXELFORMAT=842094158
# CAPTURE_MAIN_BUFFER_COUNT: 缓冲区数量。
CAPTURE_MAIN_BUFFER_COUNT=4

# CAPTURE_SUB_ENABLE: 是否启用该对象。
CAPTURE_SUB_ENABLE=1
# CAPTURE_SUB_NAME: 名称，用于日志和通道标识。
CAPTURE_SUB_NAME=self_path
# CAPTURE_SUB_DEVICE: 设备节点。
CAPTURE_SUB_DEVICE=/dev/video1
# CAPTURE_SUB_WIDTH: 宽度。
CAPTURE_SUB_WIDTH=1280
# CAPTURE_SUB_HEIGHT: 高度。
CAPTURE_SUB_HEIGHT=720
# CAPTURE_SUB_PIXELFORMAT: 像素格式，十进制 V4L2 fourcc。
CAPTURE_SUB_PIXELFORMAT=842094158
# CAPTURE_SUB_BUFFER_COUNT: 缓冲区数量。
CAPTURE_SUB_BUFFER_COUNT=4

# -------------------------
# audio source
# -------------------------
# AUDIO_ENABLE:
#   0 disables audio capture/encode.
#   1 enables ALSA capture -> configured audio encoder, then sends audio to outputs bound by AUDIO_BIND_STREAM_INDEX.
# AUDIO_FORMAT: 1 = PCM S16LE.
# AUDIO_CODEC: 4 = G711 A-law, 5 = G711 mu-law, 2 = AAC.
# AUDIO_G711_MODE: 0 = G711 A-law, 1 = G711 mu-law.
# AUDIO_AAC_PROFILE: 2 = AAC-LC.
# AUDIO_ENABLE: 是否启用音频采集和编码。
AUDIO_ENABLE=1
# AUDIO_DEVICE: ALSA 音频设备名。
AUDIO_DEVICE=default
# AUDIO_SAMPLE_RATE: 音频采样率。
AUDIO_SAMPLE_RATE=8000
# AUDIO_CHANNELS: 音频通道数。
AUDIO_CHANNELS=1
# AUDIO_FORMAT: 音频采样格式，1=PCM S16LE。
AUDIO_FORMAT=1
# AUDIO_PERIOD_FRAMES: ALSA period 帧数。
AUDIO_PERIOD_FRAMES=160
# AUDIO_BUFFER_PERIODS: ALSA buffer 包含的 period 数。
AUDIO_BUFFER_PERIODS=4
# AUDIO_SOURCE_SLOTS: 音频帧源缓存槽数量。
AUDIO_SOURCE_SLOTS=8
# AUDIO_RETRY_MS: 音频采集失败重试间隔，单位毫秒。
AUDIO_RETRY_MS=5
# AUDIO_MAX_CONSECUTIVE_FAILURES: 音频连续失败阈值。
AUDIO_MAX_CONSECUTIVE_FAILURES=30
# AUDIO_CODEC: 音频编码格式，4=G711A，5=G711U，2=AAC。
AUDIO_CODEC=4
# AUDIO_G711_MODE: G711 模式，0=A-law，1=mu-law。
AUDIO_G711_MODE=0
# AUDIO_AAC_BITRATE: AAC 目标码率。
AUDIO_AAC_BITRATE=32000
# AUDIO_AAC_PROFILE: AAC profile，2=AAC-LC。
AUDIO_AAC_PROFILE=2
# AUDIO_BIND_STREAM_INDEX: 音频绑定的视频流索引。
AUDIO_BIND_STREAM_INDEX=0

# GATEWAY_STREAM_COUNT: 视频码流数量。
GATEWAY_STREAM_COUNT=2

# -------------------------
# main 码流
# -------------------------
# STREAM_MAIN_ENABLE: 是否启用该对象。
STREAM_MAIN_ENABLE=1
# STREAM_MAIN_NAME: 名称，用于日志和通道标识。
STREAM_MAIN_NAME=main
# STREAM_MAIN_SOURCE_INDEX: 绑定的采集源索引，0=main_path，1=self_path。
STREAM_MAIN_SOURCE_INDEX=0
# STREAM_MAIN_WIDTH: 宽度。
STREAM_MAIN_WIDTH=1920
# STREAM_MAIN_HEIGHT: 高度。
STREAM_MAIN_HEIGHT=1080
# STREAM_MAIN_FPS: 帧率。
STREAM_MAIN_FPS=30
# STREAM_MAIN_BITRATE: 码率，单位 bit/s。
STREAM_MAIN_BITRATE=6291456
# STREAM_MAIN_GOP: GOP 长度。
STREAM_MAIN_GOP=30
# STREAM_MAIN_RC_MODE: 码率控制模式，0=VBR，1=CBR，2=FIXQP，3=AVBR。
STREAM_MAIN_RC_MODE=1 # 0=VBR, 1=CBR, 2=FIXQP, 3=AVBR
# STREAM_MAIN_H264_PROFILE: H.264 profile，例如 100=High。
STREAM_MAIN_H264_PROFILE=100
# STREAM_MAIN_H264_LEVEL: H.264 level。
STREAM_MAIN_H264_LEVEL=42
# STREAM_MAIN_H264_CABAC_EN: 是否启用 H.264 CABAC。
STREAM_MAIN_H264_CABAC_EN=1
# STREAM_MAIN_QP_INIT: 初始 QP。
STREAM_MAIN_QP_INIT=30
# STREAM_MAIN_QP_MIN: P/B 帧最小 QP。
STREAM_MAIN_QP_MIN=22
# STREAM_MAIN_QP_MAX: P/B 帧最大 QP。
STREAM_MAIN_QP_MAX=44
# STREAM_MAIN_QP_MIN_I: I 帧最小 QP。
STREAM_MAIN_QP_MIN_I=20
# STREAM_MAIN_QP_MAX_I: I 帧最大 QP。
STREAM_MAIN_QP_MAX_I=40
# STREAM_MAIN_QP_MAX_STEP: 相邻帧 QP 最大变化步长。
STREAM_MAIN_QP_MAX_STEP=8
# 主码流动态帧率档位：setFps 会按目标 FPS 整体切换 fps/bitrate/gop/rc/QP。
# STREAM_MAIN_DYNAMIC_LOW_FPS: 低照档位帧率。
STREAM_MAIN_DYNAMIC_LOW_FPS=15
# STREAM_MAIN_DYNAMIC_LOW_BITRATE: 低照档位码率，单位 bit/s。
STREAM_MAIN_DYNAMIC_LOW_BITRATE=3145728
# STREAM_MAIN_DYNAMIC_LOW_GOP: 低照档位GOP 长度。
STREAM_MAIN_DYNAMIC_LOW_GOP=15
# STREAM_MAIN_DYNAMIC_LOW_RC_MODE: 低照档位码率控制模式，0=VBR，1=CBR，2=FIXQP，3=AVBR。
STREAM_MAIN_DYNAMIC_LOW_RC_MODE=1
# STREAM_MAIN_DYNAMIC_LOW_QP_INIT: 低照档位初始 QP。
STREAM_MAIN_DYNAMIC_LOW_QP_INIT=30
# STREAM_MAIN_DYNAMIC_LOW_QP_MIN: 低照档位P/B 帧最小 QP。
STREAM_MAIN_DYNAMIC_LOW_QP_MIN=22
# STREAM_MAIN_DYNAMIC_LOW_QP_MAX: 低照档位P/B 帧最大 QP。
STREAM_MAIN_DYNAMIC_LOW_QP_MAX=44
# STREAM_MAIN_DYNAMIC_LOW_QP_MIN_I: 低照档位I 帧最小 QP。
STREAM_MAIN_DYNAMIC_LOW_QP_MIN_I=20
# STREAM_MAIN_DYNAMIC_LOW_QP_MAX_I: 低照档位I 帧最大 QP。
STREAM_MAIN_DYNAMIC_LOW_QP_MAX_I=40
# STREAM_MAIN_DYNAMIC_LOW_QP_MAX_STEP: 低照档位相邻帧 QP 最大变化步长。
STREAM_MAIN_DYNAMIC_LOW_QP_MAX_STEP=8
# STREAM_MAIN_DYNAMIC_NORMAL_FPS: 正常档位帧率。
STREAM_MAIN_DYNAMIC_NORMAL_FPS=30
# STREAM_MAIN_DYNAMIC_NORMAL_BITRATE: 正常档位码率，单位 bit/s。
STREAM_MAIN_DYNAMIC_NORMAL_BITRATE=6291456
# STREAM_MAIN_DYNAMIC_NORMAL_GOP: 正常档位GOP 长度。
STREAM_MAIN_DYNAMIC_NORMAL_GOP=30
# STREAM_MAIN_DYNAMIC_NORMAL_RC_MODE: 正常档位码率控制模式，0=VBR，1=CBR，2=FIXQP，3=AVBR。
STREAM_MAIN_DYNAMIC_NORMAL_RC_MODE=1
# STREAM_MAIN_DYNAMIC_NORMAL_QP_INIT: 正常档位初始 QP。
STREAM_MAIN_DYNAMIC_NORMAL_QP_INIT=30
# STREAM_MAIN_DYNAMIC_NORMAL_QP_MIN: 正常档位P/B 帧最小 QP。
STREAM_MAIN_DYNAMIC_NORMAL_QP_MIN=22
# STREAM_MAIN_DYNAMIC_NORMAL_QP_MAX: 正常档位P/B 帧最大 QP。
STREAM_MAIN_DYNAMIC_NORMAL_QP_MAX=44
# STREAM_MAIN_DYNAMIC_NORMAL_QP_MIN_I: 正常档位I 帧最小 QP。
STREAM_MAIN_DYNAMIC_NORMAL_QP_MIN_I=20
# STREAM_MAIN_DYNAMIC_NORMAL_QP_MAX_I: 正常档位I 帧最大 QP。
STREAM_MAIN_DYNAMIC_NORMAL_QP_MAX_I=40
# STREAM_MAIN_DYNAMIC_NORMAL_QP_MAX_STEP: 正常档位相邻帧 QP 最大变化步长。
STREAM_MAIN_DYNAMIC_NORMAL_QP_MAX_STEP=8
# STREAM_MAIN_DYNAMIC_BRIGHT_FPS: 亮光档位帧率。
STREAM_MAIN_DYNAMIC_BRIGHT_FPS=60
# STREAM_MAIN_DYNAMIC_BRIGHT_BITRATE: 亮光档位码率，单位 bit/s。
STREAM_MAIN_DYNAMIC_BRIGHT_BITRATE=12582912
# STREAM_MAIN_DYNAMIC_BRIGHT_GOP: 亮光档位GOP 长度。
STREAM_MAIN_DYNAMIC_BRIGHT_GOP=60
# STREAM_MAIN_DYNAMIC_BRIGHT_RC_MODE: 亮光档位码率控制模式，0=VBR，1=CBR，2=FIXQP，3=AVBR。
STREAM_MAIN_DYNAMIC_BRIGHT_RC_MODE=1
# STREAM_MAIN_DYNAMIC_BRIGHT_QP_INIT: 亮光档位初始 QP。
STREAM_MAIN_DYNAMIC_BRIGHT_QP_INIT=30
# STREAM_MAIN_DYNAMIC_BRIGHT_QP_MIN: 亮光档位P/B 帧最小 QP。
STREAM_MAIN_DYNAMIC_BRIGHT_QP_MIN=22
# STREAM_MAIN_DYNAMIC_BRIGHT_QP_MAX: 亮光档位P/B 帧最大 QP。
STREAM_MAIN_DYNAMIC_BRIGHT_QP_MAX=44
