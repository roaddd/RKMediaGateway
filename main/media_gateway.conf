# =========================
# RKMediaGateway 多路流配置
# =========================

# 网关公共配置
GATEWAY_LOW_LATENCY_MODE=1
GATEWAY_STATS_INTERVAL_SEC=5
GATEWAY_CAPTURE_RETRY_MS=5
GATEWAY_MAX_CONSECUTIVE_FAILURES=30
GATEWAY_RECORD_FILE_PATH=
GATEWAY_RECORD_FLUSH_INTERVAL_FRAMES=30
GATEWAY_CONFIG_FILE_PATH=media_gateway.conf
# LOG_LEVEL: 0=debug, 1=info, 2=warn, 3=error
LOG_LEVEL=2

# -------------------------
# Dynamic frame-rate policy
# -------------------------
# AE-driven policy: bright=60fps, normal=30fps, low-light=15fps.
DYNAMIC_FPS_ENABLE=1
DYNAMIC_FPS_NORMAL_FPS=30
DYNAMIC_FPS_LOW_LIGHT_FPS=15
DYNAMIC_FPS_BRIGHT_FPS=60
DYNAMIC_FPS_MIN_SWITCH_INTERVAL_MS=30000
DYNAMIC_FPS_EVALUATE_INTERVAL_MS=1000
DYNAMIC_FPS_BRIGHT_CONFIRM_MS=1000
DYNAMIC_FPS_LOW_LIGHT_CONFIRM_MS=15000
DYNAMIC_FPS_BRIGHT_MAX_EXPOSURE_US=8000
DYNAMIC_FPS_BRIGHT_MAX_ANALOG_GAIN=2.0
DYNAMIC_FPS_BRIGHT_MIN_MEAN_LUMA=58
DYNAMIC_FPS_LOW_LIGHT_MIN_EXPOSURE_RATIO=0.85
DYNAMIC_FPS_LOW_LIGHT_MIN_ANALOG_GAIN=4.0
DYNAMIC_FPS_LOW_LIGHT_MAX_MEAN_LUMA=42
DYNAMIC_FPS_AE_SCENE_CONFIRM_MS=3000

# -------------------------
# ISP / RKAIQ lifecycle
# -------------------------
# ISP_ENABLE:
#   0 disables RKAIQ and keeps the existing plain V4L2 capture path.
#   1 starts RKAIQ before V4L2 STREAMON, then stops it after V4L2 deinit.
# ISP_SENSOR_NAME can be empty; RKAIQ will try to resolve it from ISP_VIDEO_DEVICE.
# ISP_WORKING_MODE: 0=normal, 16=HDR2, 32=HDR3 for common RKAIQ SDKs.
# ISP_FALLBACK_ON_ERROR=1 lets the gateway continue when RKAIQ init fails.
ISP_ENABLE=0
ISP_SENSOR_NAME=
ISP_VIDEO_DEVICE=/dev/video0
ISP_IQ_DIR=/etc/iqfiles
ISP_FORCE_IQ_FILE=
ISP_WIDTH=1920
ISP_HEIGHT=1080
ISP_WORKING_MODE=0
ISP_KEEP_EXTERNAL_HW_STATE=0
ISP_FALLBACK_ON_ERROR=1

# -------------------------
# ISP health diagnostics
# -------------------------
# ISP_HEALTH_CHECK_ENABLE enables health state evaluation in [ISP_STAT].
# ISP_META_TIMEOUT_MS marks metas callback stalled after this interval.
# ISP_MAX_ERROR_COUNT marks ISP unhealthy after this many RKAIQ error callbacks.
# ISP_RESTART_ON_FAULT is reserved for a future coordinated V4L2/RKAIQ restart path.
ISP_HEALTH_CHECK_ENABLE=1
ISP_META_TIMEOUT_MS=2000
ISP_MAX_ERROR_COUNT=3
ISP_RESTART_ON_FAULT=0

# -------------------------
# ISP low-light scene optimization
# -------------------------
# Enables automatic night/low-light optimization based on RKAIQ AE env_lux/mean_luma.
# Enter/exit thresholds use hysteresis to avoid frequent toggling near the boundary.
# In low light, the gateway can raise exposure/gain, increase NR, lower sharpness,
# and boost encoder bitrate to absorb sensor noise complexity.
ISP_LOW_LIGHT_ENABLE=0
ISP_LOW_LIGHT_ENTER_LUX=20
ISP_LOW_LIGHT_EXIT_LUX=35
ISP_LOW_LIGHT_ENTER_MEAN_LUMA=35
ISP_LOW_LIGHT_EXIT_MEAN_LUMA=48
ISP_LOW_LIGHT_EXPOSURE_GAIN=-1
ISP_LOW_LIGHT_EXPOSURE_TIME=-1
ISP_LOW_LIGHT_NR_STRENGTH=70
ISP_LOW_LIGHT_SHARPNESS=35
ISP_LOW_LIGHT_NORMAL_NR_STRENGTH=-1
ISP_LOW_LIGHT_NORMAL_SHARPNESS=-1
ISP_LOW_LIGHT_BITRATE_BOOST_PERCENT=25
ISP_LOW_LIGHT_QP_DELTA=-3
ISP_LOW_LIGHT_MIN_SWITCH_INTERVAL_MS=5000

# -------------------------
# ISP runtime image controls
# -------------------------
# ISP_CONTROL_ENABLE:
#   0 keeps IQ/3A defaults unchanged.
#   1 applies the fields below after RKAIQ start.
# Integer controls use -1 to skip. Exposure/WB float values use <=0 to skip.
# OP mode values follow RKAIQ opMode_t: 0=auto, 1=manual, 2=semi-auto.
# ISP_POWER_LINE_FREQ: -1=skip, 0=disabled, 1=50Hz, 2=60Hz.
ISP_CONTROL_ENABLE=0
ISP_BRIGHTNESS=-1
ISP_CONTRAST=-1
ISP_SATURATION=-1
ISP_HUE=-1
ISP_SHARPNESS=-1
ISP_EXPOSURE_MODE=-1
ISP_EXPOSURE_TIME=-1
ISP_EXPOSURE_GAIN=-1
ISP_WB_MODE=-1
ISP_WB_CT=0
ISP_WB_RGAIN=-1
ISP_WB_GRGAIN=-1
ISP_WB_GBGAIN=-1
ISP_WB_BGAIN=-1
ISP_ANTI_FLICKER_ENABLE=-1
ISP_POWER_LINE_FREQ=-1
ISP_NR_MODE=-1
ISP_ANR_STRENGTH=-1
ISP_DEHAZE_MODE=-1
ISP_DEHAZE_STRENGTH=-1

# 性能测试埋点配置
# GATEWAY_BENCH_ENABLE:
#   0 关闭 [BENCH] 性能日志；1 开启采集、编码、推流入队分段耗时统计。
# GATEWAY_BENCH_SAMPLE_EVERY:
#   每隔多少个采集帧打印一条 [BENCH_FRAME] 逐帧日志。排查性能瓶颈时设为 1，即每帧打印。
# GATEWAY_BENCH_PRINT_INTERVAL_SEC:
#   [BENCH_SUMMARY] 汇总日志打印周期，单位秒；不影响逐帧 [BENCH_FRAME] 日志。
GATEWAY_BENCH_ENABLE=1
GATEWAY_BENCH_SAMPLE_EVERY=30
GATEWAY_BENCH_PRINT_INTERVAL_SEC=5

# -------------------------
# 采集源
# -------------------------
# 第一阶段采用 main_path/self_path 双采集源设计：
#   CAPTURE_MAIN_* 通常绑定 rkisp main_path，例如 /dev/video0，推荐 1920x1080。
#   CAPTURE_SUB_*  通常绑定 rkisp self_path，例如 /dev/video1，推荐 1280x720。
# STREAM_*_SOURCE_INDEX 用于把码流绑定到采集源：0=main_path，1=self_path。
GATEWAY_CAPTURE_SOURCE_COUNT=2

CAPTURE_MAIN_ENABLE=1
CAPTURE_MAIN_NAME=main_path
CAPTURE_MAIN_DEVICE=/dev/video0
CAPTURE_MAIN_WIDTH=1920
CAPTURE_MAIN_HEIGHT=1080
CAPTURE_MAIN_PIXELFORMAT=842094158
CAPTURE_MAIN_BUFFER_COUNT=4

CAPTURE_SUB_ENABLE=1
CAPTURE_SUB_NAME=self_path
CAPTURE_SUB_DEVICE=/dev/video1
CAPTURE_SUB_WIDTH=1280
CAPTURE_SUB_HEIGHT=720
CAPTURE_SUB_PIXELFORMAT=842094158
CAPTURE_SUB_BUFFER_COUNT=4

# -------------------------
# audio source
# -------------------------
# AUDIO_ENABLE:
#   0 disables audio capture/encode.
#   1 enables ALSA capture -> configured audio encoder, then sends audio to outputs bound by AUDIO_BIND_STREAM_INDEX.
# AUDIO_FORMAT: 1 = PCM S16LE.
# AUDIO_CODEC: 4 = G711 A-law, 5 = G711 mu-law, 2 = AAC.
# AUDIO_G711_MODE: 0 = G711 A-law, 1 = G711 mu-law.
# AUDIO_AAC_PROFILE: 2 = AAC-LC.
AUDIO_ENABLE=1
AUDIO_DEVICE=default
AUDIO_SAMPLE_RATE=8000
AUDIO_CHANNELS=1
AUDIO_FORMAT=1
AUDIO_PERIOD_FRAMES=160
AUDIO_BUFFER_PERIODS=4
AUDIO_SOURCE_SLOTS=8
AUDIO_RETRY_MS=5
AUDIO_MAX_CONSECUTIVE_FAILURES=30
AUDIO_CODEC=4
AUDIO_G711_MODE=0
AUDIO_AAC_BITRATE=32000
AUDIO_AAC_PROFILE=2
AUDIO_BIND_STREAM_INDEX=0

GATEWAY_STREAM_COUNT=2

